<svg width="600" height="260" viewBox="0 15 580 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="godrejGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C11566"/>
      <stop offset="50%" stop-color="#802682"/>
      <stop offset="100%" stop-color="#1E6EB6"/>
    </linearGradient>
    <filter id="godrejShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#C11566" flood-opacity="0.25"/>
