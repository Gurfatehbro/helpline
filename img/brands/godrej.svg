  <text x="252" y="132" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="#C11566" letter-spacing="3">Godrej</text>
  <line x1="254" y1="152" x2="540" y2="152" stroke="url(#godrejGrad)" stroke-width="4" stroke-linecap="round"/>
  <text x="256" y="188" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="22" fill="#334155" letter-spacing="5">SERVICE CENTER</text>
