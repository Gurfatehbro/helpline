<svg width="600" height="275" viewBox="0 0 600 275" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ifbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E36"/>
      <stop offset="100%" stop-color="#B80C14"/>
    </linearGradient>
    <filter id="ifbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#ED1C24" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Circular Badge -->
  <circle cx="138" cy="137.5" r="88" fill="url(#ifbGrad)" filter="url(#ifbShadow)"/>
  <circle cx="138" cy="137.5" r="80" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2.5"/>
  <!-- White IFB Monogram -->
  <text x="138" y="152" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">IFB</text>
  <!-- Right Wordmark -->
  <text x="265" y="138" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" fill="#ED1C24" letter-spacing="4">IFB</text>
  <text x="375" y="138" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="28" fill="#1E293B" letter-spacing="2">APPLIANCES</text>
  <line x1="267" y1="156" x2="550" y2="156" stroke="#ED1C24" stroke-width="3" stroke-linecap="round"/>
  <text x="268" y="185" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#475569" letter-spacing="4">SERVICE CENTER</text>
  <text x="268" y="206" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="12" fill="#ED1C24" letter-spacing="2">SET YOURSELF FREE</text>
</svg>