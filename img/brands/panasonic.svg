<svg width="600" height="260" viewBox="0 15 580 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006CD4"/>
      <stop offset="100%" stop-color="#003E7E"/>
    </linearGradient>
    <filter id="panShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0056A8" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Big Circular Emblem -->
  <circle cx="125" cy="135" r="105" fill="url(#panGrad)" filter="url(#panShadow)"/>
  <circle cx="125" cy="135" r="96" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <text x="125" y="157" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="68" fill="#ffffff" text-anchor="middle">P</text>
  <!-- Big Wordmark -->
  <text x="252" y="132" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="58" fill="#0056A8" letter-spacing="2">Panasonic</text>
  <line x1="254" y1="152" x2="565" y2="152" stroke="#0056A8" stroke-width="4" stroke-linecap="round"/>
  <text x="256" y="188" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="22" fill="#334155" letter-spacing="5">SERVICE CENTER</text>
</svg>