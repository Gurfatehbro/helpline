  <!-- Big Wordmark -->
  <text x="252" y="132" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="64" fill="#034EA2" letter-spacing="4">SAMSUNG</text>
