<svg width="600" height="275" viewBox="0 0 600 275" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="whirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14345C"/>
      <stop offset="100%" stop-color="#07172B"/>
    </linearGradient>
    <filter id="whirlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B2341" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Circular Badge -->
  <circle cx="138" cy="137.5" r="88" fill="url(#whirlGrad)" filter="url(#whirlShadow)"/>
  <circle cx="138" cy="137.5" r="80" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2.5"/>
  <!-- Golden Whirl Swirl Motif -->
  <ellipse cx="138" cy="137.5" rx="55" ry="24" fill="none" stroke="#EEB210" stroke-width="4.5" transform="rotate(-25 138 137.5)"/>
  <circle cx="138" cy="137.5" r="14" fill="#EEB210"/>
  <circle cx="138" cy="137.5" r="8" fill="#14345C"/>
  <!-- Right Wordmark -->
  <text x="265" y="138" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="48" fill="#0B2341" letter-spacing="1">Whirlpool</text>
  <line x1="267" y1="156" x2="540" y2="156" stroke="#EEB210" stroke-width="3" stroke-linecap="round"/>
  <text x="268" y="185" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="16" fill="#475569" letter-spacing="4">SERVICE CENTER</text>
  <text x="268" y="206" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="12" fill="#D99B00" letter-spacing="2">EVERY DAY, CARE</text>
</svg>