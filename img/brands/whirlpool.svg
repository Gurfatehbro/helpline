<svg width="600" height="260" viewBox="0 15 580 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="whirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14345C"/>
      <stop offset="100%" stop-color="#07172B"/>
    </linearGradient>
    <filter id="whirlShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0B2341" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Big Circular Emblem -->
  <circle cx="125" cy="135" r="105" fill="url(#whirlGrad)" filter="url(#whirlShadow)"/>
  <circle cx="125" cy="135" r="96" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="3"/>
  <ellipse cx="125" cy="135" rx="68" ry="30" fill="none" stroke="#EEB210" stroke-width="5.5" transform="rotate(-25 125 135)"/>
  <circle cx="125" cy="135" r="17" fill="#EEB210"/>
  <circle cx="125" cy="135" r="9.5" fill="#14345C"/>
  <!-- Big Wordmark -->
  <text x="252" y="132" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="58" fill="#0B2341" letter-spacing="1.5">Whirlpool</text>
  <line x1="254" y1="152" x2="565" y2="152" stroke="#EEB210" stroke-width="4" stroke-linecap="round"/>
  <text x="256" y="188" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="22" fill="#334155" letter-spacing="5">SERVICE CENTER</text>
</svg>